# Step 1 — Raw traffic preprocessing config.
# See docs/datasets.md §5 for the full pipeline description.
# All paths are relative to the repository root.

seed: 42

paths:
  raw_dir: dataset            # contains NF-*-v2/data/NF-*-v2.csv
  out_dir: data/processed     # task_{t}.parquet + manifest.json written here

# Dataset directory name -> short source code stamped onto every row.
# NF-UNSW-NB15-v2 stays excluded (no class survives dropping it once
# BoT-IoT is back -- see docs/dataset-plan.md §1). NF-BoT-IoT-v2 is back in,
# restricted to Reconnaissance only via trench_ids.labels.CLASS_DATASETS.
datasets:
  NF-ToN-IoT-v2: ToN
  NF-CSE-CIC-IDS2018-v2: CSE
  NF-BoT-IoT-v2: BoT

sampling:
  # QUOTA-BASED SAMPLING (rewritten 2026-08-16, replacing "keep every attack
  # row in full, subsample benign to a small fixed pool").
  #
  # Why the previous design was replaced -- three measured defects, all
  # traceable to the same root cause (attack volume was uncapped while the
  # benign pool was fixed and tiny):
  #
  #   1. Benign duplication. Step 2's benign selector had to sample WITH
  #      REPLACEMENT to reach benign_ratio, replicating ~5,600 unique train
  #      flows 54-158x. Benign is ~25% of every pooled metric, so a quarter
  #      of every headline number rested on a few thousand distinct flows.
  #   2. Cross-task benign leakage. Tasks drew benign independently from
  #      shared pools, so 47-72 flow_ids appeared in one task's train split
  #      and another task's test split -- train/test contamination on the
  #      benchmark's largest class.
  #   3. Task-size and class-size imbalance. Largest:smallest task was 2.9x,
  #      and within T3 the DDoS:Infiltration ratio was ~30:1, leaving
  #      Infiltration at ~0.5% of the training signal (its F1 never rose
  #      above 0.28 in any run). Per-class forgetting was not measurable for
  #      the rare classes at all.
  #
  # The quota planner (preprocess.compute_quotas) fixes all three: every
  # task gets the SAME budget, waterfilled evenly across its classes and
  # their source datasets, and each task's benign slice is disjoint from
  # every other task's.

  # Attack rows per task, split as evenly as availability allows across that
  # task's classes (a class short of its even share saturates and the
  # remainder is redistributed). 390,000 is set by the binding constraint
  # below: it is 3 x benign_per_task, so Step 2's benign_ratio=3.0 is exactly
  # satisfiable with no sampling-with-replacement anywhere.
  attack_per_task: 390000

  # Benign rows per task, drawn disjointly across tasks from that task's own
  # contributing datasets. The ceiling is NF-BoT-IoT-v2: T2 (Reconnaissance)
  # can only draw benign from BoT-IoT, which holds just 135,037 benign rows
  # in total (verified against the raw CSV). 130,000 leaves headroom under
  # that hard ceiling while keeping every task identical in size. ToN
  # (6,099,469) and CSE (16,635,567) are nowhere near binding.
  benign_per_task: 130000

  # CSV read chunk size (rows). Files are up to 6 GB — never read whole.
  chunk_size: 500000

# Per-task stratified split (by canonical class). Must sum to 1.0.
split:
  train: 0.70
  val: 0.15
  test: 0.15

# Drop exact-duplicate flow records (identical across all original columns).
dedup: true
