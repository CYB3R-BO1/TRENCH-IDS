# Step 1 — Raw traffic preprocessing config.
# See docs/datasets.md §5 for the full pipeline description.
# All paths are relative to the repository root.

seed: 42

paths:
  raw_dir: dataset            # contains NF-*-v2/data/NF-*-v2.csv
  out_dir: data/processed     # task_{t}.parquet + manifest.json written here

# Dataset directory name -> short source code stamped onto every row.
# NF-UNSW-NB15-v2 stays excluded (no class survives dropping it once
# BoT-IoT is back -- see docs/dataset-plan.md §1). NF-BoT-IoT-v2 is back in,
# restricted to Reconnaissance only via trench_ids.labels.CLASS_DATASETS.
datasets:
  NF-ToN-IoT-v2: ToN
  NF-CSE-CIC-IDS2018-v2: CSE
  NF-BoT-IoT-v2: BoT

sampling:
  # NOTE: attack_per_class_cap is intentionally REMOVED. Every attack row
  # that passes trench_ids.labels.CLASS_DATASETS' per-dataset restriction
  # and isn't in EXCLUDED_CLASSES is kept, in full -- no pre-graph sampling
  # cap. See docs/superpowers/specs/2026-07-13-dataset-task-respec-design.md
  # §3. Any class-level balancing now happens after Step 2 graph
  # construction, on constructed graphs, not here.

  # Benign pool retained per dataset during the streaming pass. Tasks draw
  # their benign quota from these pools (fresh per task, from the task's own
  # datasets). Kept as a runtime/memory safeguard -- not part of the
  # attack-cap removal.
  benign_per_dataset_cap: 60000

  # Benign flows added to each task (split across that task's contributing
  # datasets). This is a Step 1 pool-size safeguard, not the final
  # attack:benign ratio a task's graphs see -- Step 2's benign_ratio
  # (configs/graph.yaml) controls that. See design spec §3a.
  benign_per_task: 8000

  # CSV read chunk size (rows). Files are up to 6 GB — never read whole.
  chunk_size: 500000

# Per-task stratified split (by canonical class). Must sum to 1.0.
split:
  train: 0.70
  val: 0.15
  test: 0.15

# Drop exact-duplicate flow records (identical across all original columns).
dedup: true
