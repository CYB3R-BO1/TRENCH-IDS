# Attack-class similarity analysis config (professor-directed Step 1 redesign).
#
# Scope: 2 datasets (ToN-IoT, CSE-CIC-IDS2018), 6 attack classes -- reduced
# from the original 4-dataset/10-class design per the professor's guidance to
# cut implementation complexity. NF-UNSW-NB15-v2 and NF-BoT-IoT-v2 are dropped
# entirely; see docs/attack-class-counts.md for why (UNSW contributes almost
# nothing to the >=100K-threshold pool once BoT-IoT is also out -- its only
# relevant contribution, Reconnaissance, is 99.5% supplied by BoT-IoT anyway).

seed: 42
samples_per_class: 5000
chunk_size: 500000

paths:
  raw_dir: dataset
  out_dir: data/similarity   # per-class CSVs + centroids.csv + similarity_matrix.csv

datasets:
  NF-ToN-IoT-v2: ToN
  NF-CSE-CIC-IDS2018-v2: CSE

# 6-class pool: top classes by ToN+CSE-only combined count, dropping
# Bot/BruteForce/Infiltration (116K-143K, well below the ~685K-3.8M range of
# the other six) and Reconnaissance (UNSW+BoT-IoT only, no longer available).
classes:
  - DDoS
  - DoS
  - Scanning
  - XSS
  - Password
  - Injection

# Same 37 flow-statistic features as the original analysis (docs/datasets.md SS2.1).
features:
  - IN_BYTES
  - IN_PKTS
  - OUT_BYTES
  - OUT_PKTS
  - TCP_FLAGS
  - CLIENT_TCP_FLAGS
  - SERVER_TCP_FLAGS
  - FLOW_DURATION_MILLISECONDS
  - DURATION_IN
  - DURATION_OUT
  - MIN_TTL
  - MAX_TTL
  - LONGEST_FLOW_PKT
  - SHORTEST_FLOW_PKT
  - MIN_IP_PKT_LEN
  - MAX_IP_PKT_LEN
  - SRC_TO_DST_SECOND_BYTES
  - DST_TO_SRC_SECOND_BYTES
  - RETRANSMITTED_IN_BYTES
  - RETRANSMITTED_IN_PKTS
  - RETRANSMITTED_OUT_BYTES
  - RETRANSMITTED_OUT_PKTS
  - SRC_TO_DST_AVG_THROUGHPUT
  - DST_TO_SRC_AVG_THROUGHPUT
  - NUM_PKTS_UP_TO_128_BYTES
  - NUM_PKTS_128_TO_256_BYTES
  - NUM_PKTS_256_TO_512_BYTES
  - NUM_PKTS_512_TO_1024_BYTES
  - NUM_PKTS_1024_TO_1514_BYTES
  - TCP_WIN_MAX_IN
  - TCP_WIN_MAX_OUT
  - ICMP_TYPE
  - ICMP_IPV4_TYPE
  - DNS_QUERY_ID
  - DNS_QUERY_TYPE
  - DNS_TTL_ANSWER
  - FTP_COMMAND_RET_CODE
