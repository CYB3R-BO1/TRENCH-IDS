# Attack-class similarity analysis config.
#
# Scope: 3 datasets (ToN-IoT, CSE-CIC-IDS2018, BoT-IoT), 10-class candidate
# pool. NF-UNSW-NB15-v2 stays excluded (no class survives dropping it once
# BoT-IoT is back -- see docs/dataset-plan.md §1). Each class is restricted
# to specific dataset(s) via trench_ids.labels.CLASS_DATASETS (threaded
# through trench_ids.similarity.count_classes/sample_classes) so a class
# label that happens to also appear in an unsanctioned dataset (e.g.
# BoT-IoT's DDoS/DoS rows) never leaks into the pooled sample.

seed: 42
samples_per_class: 5000
chunk_size: 500000

paths:
  raw_dir: dataset
  out_dir: data/similarity   # per-class CSVs + centroids.csv + similarity_matrix.csv

datasets:
  NF-ToN-IoT-v2: ToN
  NF-CSE-CIC-IDS2018-v2: CSE
  NF-BoT-IoT-v2: BoT

# 10-class pool: every canonical class with a CLASS_DATASETS entry in
# labels.py. Bot/BruteForce/Infiltration (116K-143K) are included despite
# being an order of magnitude below the other seven (685K-3.8M) -- included
# for benchmark richness, not because the data changed (see labels.py
# module docstring).
classes:
  - Scanning
  - DDoS
  - Reconnaissance
  - XSS
  - DoS
  - Password
  - Injection
  - Bot
  - BruteForce
  - Infiltration

# Same 37 flow-statistic features as configs/graph.yaml (docs/datasets.md §2.1).
features:
  - IN_BYTES
  - IN_PKTS
  - OUT_BYTES
  - OUT_PKTS
  - TCP_FLAGS
  - CLIENT_TCP_FLAGS
  - SERVER_TCP_FLAGS
  - FLOW_DURATION_MILLISECONDS
  - DURATION_IN
  - DURATION_OUT
  - MIN_TTL
  - MAX_TTL
  - LONGEST_FLOW_PKT
  - SHORTEST_FLOW_PKT
  - MIN_IP_PKT_LEN
  - MAX_IP_PKT_LEN
  - SRC_TO_DST_SECOND_BYTES
  - DST_TO_SRC_SECOND_BYTES
  - RETRANSMITTED_IN_BYTES
  - RETRANSMITTED_IN_PKTS
  - RETRANSMITTED_OUT_BYTES
  - RETRANSMITTED_OUT_PKTS
  - SRC_TO_DST_AVG_THROUGHPUT
  - DST_TO_SRC_AVG_THROUGHPUT
  - NUM_PKTS_UP_TO_128_BYTES
  - NUM_PKTS_128_TO_256_BYTES
  - NUM_PKTS_256_TO_512_BYTES
  - NUM_PKTS_512_TO_1024_BYTES
  - NUM_PKTS_1024_TO_1514_BYTES
  - TCP_WIN_MAX_IN
  - TCP_WIN_MAX_OUT
  - ICMP_TYPE
  - ICMP_IPV4_TYPE
  - DNS_QUERY_ID
  - DNS_QUERY_TYPE
  - DNS_TTL_ANSWER
  - FTP_COMMAND_RET_CODE
