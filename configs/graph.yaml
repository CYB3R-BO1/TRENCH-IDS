# Step 2 — heterogeneous graph construction config.
# See docs/dataset-plan.md §3 for the node/relation design this builds.

paths:
  processed_dir: data/processed   # task_{t}.parquet from Step 1
  out_dir: data/graphs            # task_{t}_{split}.pt + graph_counts.json written here
  vocab_path: data/graphs/vocab.json

# Each task's train/val/test rows are chunked into many mini-graphs of at
# most this many flows each (last chunk per split may be smaller). Rerun
# with a different value to experiment with graph size (e.g. 100/200/300);
# point paths.out_dir at a separate directory per value to keep runs apart.
graph_size: 300

# Rows within each split are shuffled (seeded) before chunking. The source
# Parquet is ordered by canonical_label (Step 1 samples per-class, then
# concatenates), so chunking without shuffling first would produce
# mini-graphs that are almost entirely one attack class.
seed: 42

# The 37 flow-statistic features (same set used for the similarity analysis in
# configs/similarity.yaml — excludes the 4 identifier fields + PROTOCOL +
# L7_PROTO, which become node identity instead of Flow features).
features:
  - IN_BYTES
  - IN_PKTS
  - OUT_BYTES
  - OUT_PKTS
  - TCP_FLAGS
  - CLIENT_TCP_FLAGS
  - SERVER_TCP_FLAGS
  - FLOW_DURATION_MILLISECONDS
  - DURATION_IN
  - DURATION_OUT
  - MIN_TTL
  - MAX_TTL
  - LONGEST_FLOW_PKT
  - SHORTEST_FLOW_PKT
  - MIN_IP_PKT_LEN
  - MAX_IP_PKT_LEN
  - SRC_TO_DST_SECOND_BYTES
  - DST_TO_SRC_SECOND_BYTES
  - RETRANSMITTED_IN_BYTES
  - RETRANSMITTED_IN_PKTS
  - RETRANSMITTED_OUT_BYTES
  - RETRANSMITTED_OUT_PKTS
  - SRC_TO_DST_AVG_THROUGHPUT
  - DST_TO_SRC_AVG_THROUGHPUT
  - NUM_PKTS_UP_TO_128_BYTES
  - NUM_PKTS_128_TO_256_BYTES
  - NUM_PKTS_256_TO_512_BYTES
  - NUM_PKTS_512_TO_1024_BYTES
  - NUM_PKTS_1024_TO_1514_BYTES
  - TCP_WIN_MAX_IN
  - TCP_WIN_MAX_OUT
  - ICMP_TYPE
  - ICMP_IPV4_TYPE
  - DNS_QUERY_ID
  - DNS_QUERY_TYPE
  - DNS_TTL_ANSWER
  - FTP_COMMAND_RET_CODE
