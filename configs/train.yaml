# Step 4 — classifier + relation-specific memory bank training config.
# Composed via Hydra (added 2026-07-19, per pyproject.toml's own stated
# plan: "add it when the training loop (Step 4+) begins").
# See src/trench_ids/cl/train.py for the loop this configures.

model:
  # Matches configs/model.yaml's established Step 3 default — reused
  # rather than re-derived.
  hidden_dim: 64
  attn_dim: 128
  num_layers: 1
  port_tail_buckets: 32
  # How a node type's per-relation embeddings are merged.
  #   attention  HAN-style convex combination (softmax weights, sums to 1).
  #              The project default throughout; kept as the default so every
  #              earlier result stays reproducible from this config.
  #   concat     concatenate then project. Tests whether the convex
  #              combination -- which compresses R x hidden_dim to hidden_dim
  #              before anything reads it -- is what puts the GNN behind the
  #              non-graph Flat+Host baseline (0.749 vs 0.854 mean final
  #              accuracy at matched parameters). See ConcatFusion.
  fusion: attention
  # Residual connections after each relation-specific layer's fusion step.
  # Enables deeper message passing (num_layers > 1) by preserving gradient
  # flow through the layer stack. Off by default for backward compatibility.
  use_residual: false

optim:
  name: adam
  learning_rate: 0.001

train:
  epochs_per_task: 5
  warmup_epochs: 2
  batch_size: 8
  seed: 42
  # "cuda" if available, else "cpu" -- resolved in code
  # (torch.cuda.is_available()), never hardcoded here, since this repo runs
  # across machines with and without a CUDA device.
  device: auto
  # Resume from a specific task checkpoint (0 = fresh training, N = resume after task N)
  resume_from_task: 0

# Relation-aware Online EWC (Steps 6-8) -- SUPERSEDED / ARCHIVED (2026-08-23).
# This mechanism is a characterized negative result: the full experiment
# matrix (docs/results.md) found no EWC arm reduces forgetting on this
# benchmark, and a Fisher-mass audit showed the relation weighting could
# only ever modulate 2.2% of its own penalty (see
# src/trench_ids/cl/ewc.py for the full diagnosis). The active
# forgetting-mitigation mechanisms are `replay` and `distill` below. These
# keys are kept -- values untouched -- so the EWC arms of the experiment
# matrix and their negative results remain reproducible from this config.
# Do not build new work on them.
ewc:
  lambda_r: 1.0
  lambda_s: 1.0
  lambda_u: 1.0
  gamma: 0.9
  # Plain-Online-EWC baseline switch (lambda sweep, 2026-07-21): when true,
  # w_r is fixed at 1.0 for every Flow relation instead of learned via
  # importance_mlp, so lambda_r=lambda_s=lambda_u applies the same uniform,
  # unweighted penalty to all 12 EWC groups -- lambda_r=0 alone is NOT
  # equivalent, since it would zero out Flow's 5 relations entirely rather
  # than regularizing them like every other group.
  disable_learned_weighting: false
  # Fixed, non-learned w_r ablation (2026-07-29 design,
  # docs/superpowers/specs/2026-07-29-transferability-followup-design.md):
  # "learned" (default) routes S_r through importance_mlp as before;
  # "fixed" uses w_r = sigmoid(S_r) directly, no learnable parameters, so
  # there is nothing for gradient descent to collapse; "disabled" is an
  # explicit alias for disable_learned_weighting=True (w_r fixed at 1.0).
  w_r_mode: learned
  # Diagnostic instrumentation (2026-07-21 lambda-sweep follow-up): when
  # true, writes runs/<out_dir>/loss_components_task_{t}.jsonl -- one line
  # per full-loss epoch with L_cls and the raw/weighted EWC breakdown, so
  # lambda*L_EWC's actual magnitude relative to L_cls can be checked
  # directly instead of inferred from forgetting/accuracy alone.
  log_loss_components: false

# Experience replay baseline (2026-07-23 design,
# docs/superpowers/specs/2026-07-23-replay-baseline-design.md). Disabled by
# default so existing runs are unaffected. This is one of the two ACTIVE
# forgetting-mitigation mechanisms (with `distill` below); it is the paper's
# strongest positive result.
replay:
  enabled: false
  # NOTE (2026-08-18 budget sweep): the 200 default predates the benchmark
  # rebuild and its "~2.5% of ~8135 train graphs" comment is stale -- each
  # task now has 1,214 train graphs, so 200 stores 16.5%. The sweep
  # (group `budget` in run_matrix.py) selected 100 for Flat+Host (8.2%) and
  # 25 for the GNN; nothing justified 200 for either encoder. The value here
  # stays 200 only so pre-sweep run configs reproduce unchanged -- pass
  # train.replay.buffer_size_per_task explicitly for new runs.
  buffer_size_per_task: 200
  replay_fraction: 0.3 # target share of each task's combined training pool
  # Transferability-guided buffer selection (2026-07-29 design,
  # docs/superpowers/specs/2026-07-29-transferability-followup-design.md):
  # "uniform" (default) is an exact passthrough to random.sample, keeping
  # the existing §23 replay baseline byte-for-byte reproducible.
  # "enrich_high_transfer"/"enrich_low_transfer" weight buffer sampling by
  # each graph's enrichment for classes with high/low similarity to
  # already-banked classes. Task 1 always uses uniform regardless of this
  # setting (no transferability signal exists yet).
  selection: uniform

# RFR (Effective-Rank based Feature Richness) -- Forward-compatible
# representation learning (Kim et al., Neural Networks 2024).
# Adds -log(erank) loss during base session (T1) to increase representation
# effective rank, improving forward transfer to novel tasks.
# Disabled by default so existing runs are unaffected.
rfr:
  enabled: false
  # Weight on L_RFR relative to L_cls. Paper uses 0.1 as default.
  lambda: 0.1
  # Only apply during base session (T1). If false, applies to all tasks.
  apply_only_base: true
  # Mode: "global" (fused embeddings) or "relation" (per-relation)
  mode: global

# FACT (Forward Compatible Training) -- Virtual prototypes for future classes
# (Zhou et al., CVPR 2022). Adds virtual prototype + forecast loss during
# base session (T1) to reserve embedding space for future classes.
# Disabled by default so existing runs are unaffected.
fact:
  enabled: false
  # Weight on L_FACT relative to L_cls.
  lambda: 1.0
  # Number of virtual prototypes (reserved future classes)
  num_virtual: 10
  # Temperature for virtual prototype similarity
  temperature: 2.0
  # Mixup alpha for virtual instance generation
  alpha: 1.0
  # Only apply during base session (T1). If false, applies to all tasks.
  apply_only_base: true

# Transferability-weighted relation distillation (TRD) -- the ACTIVE
# regularizer that replaced relation-aware EWC above (which a Fisher-mass
# audit showed could only ever modulate 2.2% of its own penalty; see
# src/trench_ids/cl/distillation.py for the full diagnosis). Disabled by
# default so every pre-existing run config reproduces unchanged. Matrix
# result: TRD beats fine-tuning and EWC without replay; with replay,
# plain replay alone measured better than Replay+TRD.
distill:
  enabled: false
  # Weight on L_TRD relative to L_cls. The penalty is a mean cosine distance
  # in [0, 2] and the relation weights sum to 1, so lambda_d is directly
  # comparable to the cross-entropy scale -- unlike the EWC lambdas, whose
  # useful range depended on the Fisher magnitudes.
  lambda_d: 1.0
  # uniform | transfer | inverse | drift -- see distillation.WEIGHTING_MODES.
  # These form the ablation that tests the project's hypothesis:
  # "transfer" is the originally proposed method, "uniform" the
  # preserve-everything control, "inverse" the sign control, and "drift"
  # (w_r = softmax(+D_r/T), D_r measured live at each task boundary) the
  # reformulation the measured transferability-vs-drift anti-correlation
  # motivates -- "transfer" regularises hardest exactly where there is least
  # drift to prevent, so weight by drift directly instead of by a signal
  # anti-correlated with it.
  weighting: transfer
  # Softmax temperature turning S_r into w_r. Lower = more selective.
  # Measured on real runs: S_r spans roughly 0.0-0.85 across relations, so
  # 0.1 comes out nearly one-hot -- it collapsed "transfer" to "regularise
  # service_of alone", and service_of happens to be the relation that drifts
  # least across a task boundary (0.05 cosine, versus 0.60 for
  # terminated_by), making the penalty near-inert. 0.3 preserves a clear
  # ordering while leaving every relation a non-negligible share.
  temperature: 0.3
  # cosine | logit | both -- see distillation.OBJECTIVES. "cosine" matches
  # the relation embeddings, "logit" matches what each relation says about
  # the classes (through the frozen old head), "both" sums them. Default
  # "both": the two failure modes -- representation drift and decision-
  # boundary drift -- are independent, and this benchmark exhibits both.
  objective: both
  # Softmax temperature for the logit term (Hinton et al. 2015). 2.0 softens
  # the target enough to carry inter-class similarity structure rather than
  # just the argmax; the term is rescaled by tau^2 so this does not act as a
  # second lambda.
  logit_temperature: 2.0
  # Cap on the number of this task's graphs subsampled (seeded, per task)
  # for the live D_r measurement when weighting: drift. The measurement is
  # two no-grad forward passes per batch -- cheap next to a training epoch,
  # but there is no reason to run it over the full ~1,214-graph train set.
  drift_max_graphs: 60

paths:
  graphs_dir: data/graphs
  out_dir: runs/step4

# Keep the working directory as wherever the command was invoked from (repo
# root, normally) -- Hydra's default per-run output-dir chdir would break
# the relative paths above.
hydra:
  job:
    chdir: false
  run:
    dir: ${paths.out_dir}/hydra

