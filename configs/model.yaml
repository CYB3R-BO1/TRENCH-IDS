# Step 3 — relation-specific heterogeneous GNN encoder config.
# See src/trench_ids/model/rhgnn.py for the architecture this configures.

hidden_dim: 64
attn_dim: 128
num_layers: 1
port_tail_buckets: 32

# protocol_vocab_size / service_vocab_size are NOT set here -- they must
# match whichever benign_ratio graph set is being trained on and are read
# straight from that set's data/graphs*/vocab.json at model-construction
# time via RelationSpecificHeteroGNN.from_graph (see trench_ids.vocab.load_vocab).
